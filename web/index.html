<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smiski Bounce Party</title>
<link rel="stylesheet" href="/lobby.css">
<header class="brand"><a href="/">Smiski Bounce Party</a></header>
<main>
<section id="home" hidden>
<div class="welcome"><div><h1>Party lobby</h1><button id="create">Host a Party</button>
<form id="manual"><label>Join with room code <input id="roomCode" placeholder="ABCD" required pattern="[A-Za-z]{4}" maxlength="4" autocapitalize="characters"></label><button>Join room</button></form></div>
<div id="preview" class="stage" aria-hidden="true"></div></div>
</section>
<section id="room" hidden>
<h1 id="heading">Party lobby</h1>
<form id="join" hidden><label>Nickname (optional) <input id="nickname" maxlength="24" autocomplete="nickname"></label><button>Join Party</button></form>
<div class="lobby-grid">
<div id="roster" hidden><div class="stage-heading"><h2>Player trampolines</h2><span id="count"></span></div><ul id="players" class="stage" aria-label="Player trampolines"></ul></div>
<div class="lobby-sidebar"><aside id="invite" hidden><h2>Join the room</h2><img id="qr" width="160" height="160" alt="Scan with your phone to join"><span>Room code</span><strong id="inviteCode"></strong><p id="address"></p></aside>
<h2 id="gameHeading" hidden>Choose a game</h2>
<div class="choices">
<button id="start" hidden>Start Bumper Cars</button>
<button id="startTennis" hidden>Start Table Tennis</button>
<button id="startPogo" hidden>Start Pogo Race</button>
</div>
</div></div>
<section id="calibration" hidden><h2>Set up your paddles</h2>
<div id="remoteSteps" aria-live="polite"></div>
<button id="startCalibration" hidden>Start calibration</button>
<div id="motionSetup" hidden><button id="enableMotion" hidden>Allow motion access</button>
<p id="motionStatus" role="status"></p></div>
<button id="cancelSetup" hidden>Back to lobby</button></section>
<section id="race" hidden>
<div id="startCount" hidden role="status"></div>
<h2 id="gameTitle">Bumper Cars</h2><p id="raceInfo"></p>
<div class="arena-layout">
<canvas id="arena" width="760" height="500" style="width:min(100%,760px)" aria-label="Game arena"></canvas>
<aside id="gameHud" hidden>
<div class="clock-card"><span id="clockLabel">Time left</span><strong id="roundClock"></strong></div>
<h3>Leaderboard</h3><ol id="standings"></ol>
</aside>
</div>
<p id="scores"></p><p id="notice" role="status"></p>
<div id="controls" hidden>
<button id="stick" aria-label="Steering joystick"><span id="thumb"></span></button>
<button id="boost">Boost</button>
</div>
<button id="back" hidden>Back to lobby</button>
<div id="pumpPad" hidden><button id="pump">Pump</button>
<button id="pumpMotion">Enable pump motion</button><p id="pumpStatus" role="status"></p></div>
</section>
</section>
<p role="status" id="status"></p>
<button id="retry" hidden>Retry</button>
</main>
<dialog id="tennisPicker" aria-labelledby="pickerTitle">
<h2 id="pickerTitle">Choose two players</h2><div id="tennisChoices"></div>
<p id="pickerError" role="status"></p><button id="confirmPair" disabled>Continue to calibration</button>
<button id="cancelPair">Cancel</button></dialog>
<dialog id="victory" aria-labelledby="victoryTitle">
<div class="victory-body"><div id="victoryConfetti" aria-hidden="true"></div>
<div id="victoryPortraits"></div><h2 id="victoryTitle"></h2><p id="victoryScore"></p>
<div id="victoryActions"><button id="victoryRematch">Rematch</button> <button id="victoryLobby">Back to lobby</button></div>
</div>
<section class="victory-board"><h2>Final standings</h2><ol id="finalStandings"></ol></section>
</dialog><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script>
<script src="/sim.js"></script><script src="/tennis.js"></script><script src="/court.js"></script><script src="/motion.js"></script><script src="/pogo.js"></script><script src="/race.js"></script><script src="/pump.js"></script>
</html>
