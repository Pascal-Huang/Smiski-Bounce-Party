<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bounceback lobby</title>
<link rel="stylesheet" href="/lobby.css">
<header class="brand"><i aria-hidden="true">●</i> Bounceback</header>
<main>
<section id="home" hidden>
<div class="welcome"><div><h1>Party lobby</h1><button id="create">Host a Party</button>
<form id="manual"><label>Join with room code <input id="roomCode" placeholder="ABCD" required pattern="[A-Za-z]{4}" maxlength="4" autocapitalize="characters"></label><button>Join room</button></form></div>
<div id="preview" class="stage" aria-hidden="true"></div></div>
</section>
<section id="room" hidden>
<h1 id="heading">Party lobby</h1>
<form id="join" hidden><label>Nickname (optional) <input id="nickname" maxlength="24" autocomplete="nickname"></label><button>Join Party</button></form>
<div class="lobby-grid">
<div id="roster" hidden><div class="stage-heading"><h2>Player pillars</h2><span id="count"></span></div><ul id="players" class="stage" aria-label="Player pillars"></ul></div>
<aside id="invite" hidden><h2>Join the room</h2><img id="qr" width="160" height="160" alt="Scan with your phone to join"><span>Room code</span><strong id="inviteCode"></strong><p id="address"></p></aside>
</div>
<h2 id="gameHeading" hidden>Choose a game</h2>
<div class="choices">
<button id="start" hidden>Start Bumper Cars</button>
<button id="startTennis" hidden>Start Table Tennis</button>
<button id="startPogo" hidden>Start Pogo Race</button>
</div>
<div id="motionSetup" hidden><button id="enableMotion">Enable paddle motion</button>
<button id="useTouch" hidden>Use touch</button>
<span id="motionStatus" role="status">Hold your phone in your playing grip to calibrate.</span></div>
<section id="race" hidden>
<h2 id="gameTitle">Bumper Cars</h2><p id="raceInfo"></p>
<div class="arena-layout">
<canvas id="arena" width="760" height="500" style="width:min(100%,760px)" aria-label="Game arena"></canvas>
<aside id="gameHud" hidden>
<div class="clock-card"><span id="clockLabel">Time left</span><strong id="roundClock"></strong></div>
<h3>Leaderboard</h3><ol id="standings"></ol>
</aside>
</div>
<p id="scores"></p><p id="notice" role="status"></p>
<div id="controls" hidden>
<button id="stick" aria-label="Steering joystick"><span id="thumb"></span></button>
<button id="boost">Boost</button>
</div>
<div id="paddle" hidden>
<label>Aim <select id="lane"><option value="-1">Left</option><option value="0" selected>Centre</option><option value="1">Right</option></select></label>
<button id="swing">Swing</button>
</div>
<button id="back" hidden>Back to lobby</button>
<div id="pumpPad" hidden><button id="pump">Pump</button>
<button id="pumpMotion">Enable pump motion</button><p id="pumpStatus" role="status"></p></div>
</section>
<a href="/">Back to home</a>
</section>
<p role="status" id="status"></p>
<button id="retry" hidden>Retry</button>
</main><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script>
<script src="/sim.js"></script><script src="/tennis.js"></script><script src="/court.js"></script><script src="/motion.js"></script><script src="/pogo.js"></script><script src="/race.js"></script><script src="/pump.js"></script>
</html>
